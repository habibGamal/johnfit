<body class="bg-background-dark font-display text-white">
<div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto shadow-2xl overflow-x-hidden">

<main class="flex-1 pb-28">
<section class="px-4 py-2 mb-4">
<div class="flex justify-between items-center text-center">
<div class="flex flex-col gap-1 items-center opacity-40">
<span class="text-xs font-medium uppercase tracking-wide">Mon</span>
<span class="text-sm font-bold">15</span>
</div>
<div class="flex flex-col gap-1 items-center opacity-40">
<span class="text-xs font-medium uppercase tracking-wide">Tue</span>
<span class="text-sm font-bold">16</span>
</div>
<div class="flex flex-col gap-1 items-center opacity-40">
<span class="text-xs font-medium uppercase tracking-wide">Wed</span>
<span class="text-sm font-bold">17</span>
</div>
<div class="flex flex-col gap-1 items-center bg-primary rounded-xl px-3 py-2 text-background-dark shadow-[0_0_20px_rgba(255,189,51,0.3)] border border-primary">
<span class="text-xs font-bold uppercase tracking-wide">Thu</span>
<span class="text-lg font-black leading-none">18</span>
</div>
<div class="flex flex-col gap-1 items-center opacity-40">
<span class="text-xs font-medium uppercase tracking-wide">Fri</span>
<span class="text-sm font-bold">19</span>
</div>
<div class="flex flex-col gap-1 items-center opacity-40">

</div>
<div class="bg-white/5 px-3 py-1 rounded-full border border-white/10 backdrop-blur-sm">
<span class="text-primary font-bold text-sm">3 / 5</span>
</div>
</div>
<div class="space-y-2">
<div class="rounded-full bg-white/10 h-3 overflow-hidden">
<div class="h-full rounded-full bg-primary shadow-[0_0_10px_rgba(255,189,51,0.5)]" style="width: 60%;"></div>
</div>
<p class="text-primary text-xs font-medium text-right">2 workouts left</p>
</div>
</div>
</div>
</section>

</div>

</div>
<div class="size-10 rounded-full bg-white/5 flex items-center justify-center border border-white/10">

</div>
</div>
<div class="flex items-center gap-1.5 text-primary pt-4 mt-1 border-t border-white/5">
<span class="material-symbols-outlined text-[18px] filled">stars</span>
<span class="text-sm font-bold tracking-wider">+50 PTS</span>
</div>
</div>
<button class="w-full bg-primary hover:bg-[#e6aa2e] text-background-dark font-black tracking-wide py-4 text-center text-sm uppercase transition-colors flex items-center justify-center gap-2">

<div class="bg-card-dark border border-white/10 rounded-2xl p-0 overflow-hidden">

<div class="flex justify-between items-start">
<div>
<div class="flex items-center gap-2 mb-2">
<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-white/10 text-white/80 uppercase tracking-wider">Cardio</span>
</div>
<h4 class="text-xl font-bold text-white leading-tight">HIIT Cardio</h4>
<p class="text-white/60 text-sm mt-1">High Intensity Intervals</p>
</div>
<div class="size-10 rounded-full bg-white/5 flex items-center justify-center border border-white/10">

<span class="material-symbols-outlined text-[18px] filled">stars</span>
<span class="text-sm font-bold tracking-wider">+30 PTS</span>
</div>
</div>
<button class="w-full bg-primary/10 hover:bg-primary text-primary hover:text-background-dark font-bold tracking-wide py-4 text-center text-sm uppercase transition-all flex items-center justify-center gap-2 border-t border-white/5 group">
<span class="material-symbols-outlined group-hover:fill-current transition-all" style="font-variation-settings: &quot;FILL&quot; 1;">play_arrow</span>

                    </button>
</div>
</div>
